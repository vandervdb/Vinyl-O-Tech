# Mirrors the lefthook pre-push gates (lefthook.yml) so they also run on GitHub,
# for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Gates, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # settings.gradle.kts reads CLIENT_ID / CLIENT_SECRET from local.properties and
      # spotify-lib fails at configuration time without them. They come from the repository
      # secrets; GitHub withholds secrets from pull requests opened from a fork, so the
      # placeholders keep those builds configurable (CI never talks to Spotify).
      - name: Write local.properties
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "CLIENT_ID=${CLIENT_ID:-ci-placeholder}"
            echo "CLIENT_SECRET=${CLIENT_SECRET:-ci-placeholder}"
          } > local.properties

      - name: Version catalog gates
        run: ./gradlew checkCatalogConsistency checkVersionHardcodedUsages

      - name: Colour palette gate
        run: ./gradlew checkColorPalette

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
