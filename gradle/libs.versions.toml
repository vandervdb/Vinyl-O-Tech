# ---------- Versions ----------
[versions]
android-compileSdk = "35"
android-minSdk = "26"
android-targetSdk = "35"
android-versionCode = "1"
android-versionName = "1.5"

core = "1.5.0"
kermit = "1.2.2"
kotlin = "2.4.0"
agp = "8.13.2"

# AndroidX & UI
androidx-core-ktx = "1.16.0"
# 1.2.0 exige minCompileSdk 35 / AGP >= 8.6.0 (vérifié dans les métadonnées de l'AAR) —
# le repo est à compileSdk 35 / AGP 8.7.0. Tire appcompat-resources en transitif.
core-splashscreen = "1.2.0"
appcompat = "1.7.1"
kotlinxCoroutinesTest = "1.9.0"
material = "1.13.0"
activity-compose = "1.10.1"
lifecycle = "2.8.7"
mockkAndroid = "1.14.6"
navigation = "2.8.4"
browser = "1.8.0"
datastore = "1.1.1"
material3WindowSize = "1.3.1"

fragmentKtx = "1.8.5"

# Compose
# NOT the latest stable BOM (2026.08.00) — that one bumps androidx.compose.ui to 1.12.0, which
# requires AGP 9.1+ / compileSdk 37 (this repo is on AGP 8.13.2 / compileSdk 35, and platform 37 is
# not installed in the local SDK). Pinned instead to the earliest BOM shipping material3 1.4.0
# (stable ShortNavigationBar) that still resolves here. Unpinning it means going to AGP 9 — see the
# hilt entry below for why that is currently a dead end.
compose-bom = "2025.12.00"

# KotlinX
coroutines = "1.8.1"
tinkAndroid = "1.20.0"
turbine = "1.0.0"
runner = "1.5.2"
serialization = "1.6.3"

# DI
# Pinned to the last version before AGP 9 became a hard requirement (google/dagger#5190).
# Verified 2026-09-10 by attempting the move: hilt 2.60.1 refuses AGP 8.13.2 outright ("only
# compatible with AGP 9.0.0 or higher"), so unpinning hilt and adopting AGP 9 are one and the same
# change. AGP 9 in turn makes built-in Kotlin mandatory, built-in Kotlin rejects the kapt plugin,
# and its replacement KSP has no release for Kotlin 2.4.0 (KSP switched to plain semver at 2.3.0
# and tops out at 2.3.12, targeting Kotlin 2.3). AGP 9.4.0 ships Kotlin 2.2.10 itself, so going
# "properly" built-in would downgrade this repo from 2.4.0. The remaining path is AGP 9 with
# `android.builtInKotlin=false` + `android.newDsl=false` — that builds, but both flags are already
# deprecated and disappear in AGP 10. Waiting for KSP on Kotlin 2.4 costs nothing; migrating now
# buys a config with a one-major-version shelf life.
hilt = "2.58"
hilt-androidx = "1.1.0"
hilt-nav-compose = "1.2.0"

# Other libs
gson = "2.11.0"
jackson = "2.16.2"
slf4j = "1.7.36"
coil = "2.7.0"
ktor = "2.3.12"

# Test
junit4 = "4.13.2"
androidx-junit = "1.2.1"
espresso = "3.6.1"
mockk = "1.13.10"
mockito = "5.12.0"
uiGraphics = "1.7.4"

# Lint
spotless = "6.25.0"
ktlint = "1.3.1"
ktlintGradle = "12.1.0"

# ---------- Libraries ----------
[libraries]
# Build-logic
androidx-core = { module = "androidx.test:core", version.ref = "core" }
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }

# Compose (via BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
compose-material-icons-ext = { module = "androidx.compose.material:material-icons-extended" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3WindowSize" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockkAndroid" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Lifecycle
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# KotlinX
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-androidx" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-nav-compose" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
# Kapt reads Kotlin metadata; Dagger/Hilt's bundled reader lags the Kotlin version (google/dagger#5177) — pin explicitly.
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }

# Other libs
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-android = { module = "org.slf4j:slf4j-android", version.ref = "slf4j" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Tests
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "uiGraphics" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tinkAndroid" }

# ---------- Plugins ----------
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
ktlint-gradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

